<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1122" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1122"><title id="title">Lower-precision transport with FP32 ReduceScatter input, accumulation and output</title><desc id="desc">With reduce_dtype set to FP32, native FSDP2 uses FP32 ReduceScatter. Enabling low_precision_reduce_scatter_comm infers BF16 or FP16 wire precision from mixed_precision.param_dtype. The custom path casts the FP32 input to that wire precision, exchanges destination shards through a verified node-local all-to-all, then sums and scales locally into the FP32 ReduceScatter output. It requires enabled mixed precision and FP32 reduction. Cross-node, unknown and singleton shard groups retain native communication. HSDP replica-linked shard groups must agree on eligibility and scaling; its subsequent AllReduce remains native FP32. On the custom path, replica AllReduce uses SUM because full-mesh scaling is applied in the ReduceScatter hook. Parameter AllGather and later gradient dtype casts are unchanged. FP32 addition order can differ from native ReduceScatter, so bitwise identity is not guaranteed. This diagram makes no performance claim.</desc><defs><style>text{font-family:&apos;DejaVu Sans&apos;,sans-serif;fill:#172c3f}.title{font-size:38px;font-weight:700;letter-spacing:-1px}.body{font-size:22px}.small{font-size:20px}.label,.stage{font-weight:700}.label{font-size:20px;letter-spacing:1px}.stage{font-size:24px}.muted{fill:#4e6374}.blue{fill:#205d8e}.teal{fill:#09675d}.amber{fill:#945111}.arrow{fill:none;stroke:#46677f;stroke-width:3;marker-end:url(#arrow)}</style><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#46677f" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs><rect width="1280" height="1122" fill="#fff"/><rect width="1278" height="1120" x="1" y="1" fill="none" stroke="#dce5eb" stroke-width="2" rx="18"/><text x="32" y="58" class="title">Lower-precision transport. FP32 reduction.</text><text x="34" y="96" class="body muted">FSDP2: change the communication step, not the ReduceScatter dtype contract.</text><rect width="1216" height="90" x="32" y="124" fill="#fff7e9" stroke="#ecd5ae" stroke-width="1.5" rx="12"/><text x="52" y="156" class="label amber">OPT IN: low_precision_reduce_scatter_comm = true</text><text x="52" y="190" class="body">Mixed precision on / reduce_dtype = FP32 / wire dtype follows param_dtype (BF16 or FP16)</text><rect width="1216" height="178" x="32" y="238" fill="#eff5fa" stroke="#c9dce9" stroke-width="1.5" rx="14"/><text x="52" y="275" class="label blue">01 NATIVE FP32 REDUCESCATTER</text><rect width="212" height="90" x="52" y="300" fill="#fff" stroke="#91b4cf" stroke-width="1.5" rx="10"/><text x="158" y="337" class="stage blue" text-anchor="middle">FP32 RS input</text><text x="158" y="368" class="small muted" text-anchor="middle">all shard chunks</text><path d="M 264 345 H 352" class="arrow"/><rect width="540" height="90" x="366" y="300" fill="#dcebf6" stroke="#91b4cf" stroke-width="1.5" rx="10"/><text x="636" y="337" class="stage blue" text-anchor="middle">Native ReduceScatter</text><text x="636" y="368" class="body" text-anchor="middle">FP32 collective + native scaling</text><path d="M 906 345 H 996" class="arrow"/><rect width="218" height="90" x="1010" y="300" fill="#fff" stroke="#91b4cf" stroke-width="1.5" rx="10"/><text x="1119" y="337" class="stage blue" text-anchor="middle">FP32 RS output</text><text x="1119" y="368" class="small muted" text-anchor="middle">one reduced shard</text><rect width="1216" height="296" x="32" y="440" fill="#eff8f5" stroke="#acd3c9" stroke-width="1.5" rx="14"/><text x="52" y="478" class="label teal">02 CUSTOM PATH</text><text x="294" y="478" class="body teal">Only for a verified node-local, multi-rank RS group</text><rect width="168" height="146" x="52" y="514" fill="#fff" stroke="#91b4cf" stroke-width="1.5" rx="10"/><text x="136" y="560" class="stage blue" text-anchor="middle">FP32</text><text x="136" y="592" class="stage blue" text-anchor="middle">RS input</text><text x="136" y="634" class="small muted" text-anchor="middle">unscaled</text><path d="M 220 585 H 244" class="arrow"/><rect width="160" height="146" x="254" y="514" fill="#fff2dc" stroke="#dcb374" stroke-width="1.5" rx="10"/><text x="334" y="556" class="stage amber" text-anchor="middle">Cast</text><text x="334" y="590" class="body" text-anchor="middle">wire buffer</text><text x="334" y="631" class="small amber" text-anchor="middle">BF16 / FP16</text><path d="M 414 585 H 438" class="arrow"/><rect width="266" height="146" x="448" y="514" fill="#fff2dc" stroke="#dcb374" stroke-width="1.5" rx="10"/><text x="581" y="550" class="stage amber" text-anchor="middle">All-to-all exchange</text><text x="581" y="582" class="small" text-anchor="middle">BF16 / FP16 transport</text><rect width="48" height="32" x="466" y="606" fill="#e8ba78" rx="4"/><rect width="48" height="32" x="526" y="606" fill="#e8ba78" rx="4"/><rect width="48" height="32" x="586" y="606" fill="#e8ba78" rx="4"/><rect width="48" height="32" x="646" y="606" fill="#e8ba78" rx="4"/><text x="490" y="629" class="small" text-anchor="middle">s0</text><text x="550" y="629" class="small" text-anchor="middle">s1</text><text x="610" y="629" class="small" text-anchor="middle">s2</text><text x="670" y="629" class="small" text-anchor="middle">s3</text><path d="M 714 585 H 738" class="arrow"/><rect width="228" height="146" x="748" y="514" fill="#dcebf6" stroke="#91b4cf" stroke-width="1.5" rx="10"/><text x="862" y="560" class="stage blue" text-anchor="middle">Local FP32</text><text x="862" y="592" class="stage blue" text-anchor="middle">SUM + scale</text><text x="862" y="634" class="small muted" text-anchor="middle">at the destination</text><path d="M 976 585 H 1000" class="arrow"/><rect width="218" height="146" x="1010" y="514" fill="#fff" stroke="#91b4cf" stroke-width="1.5" rx="10"/><text x="1119" y="560" class="stage blue" text-anchor="middle">FP32</text><text x="1119" y="592" class="stage blue" text-anchor="middle">RS output</text><text x="1119" y="634" class="small muted" text-anchor="middle">one reduced shard</text><text x="52" y="702" class="body teal">Each destination receives its shard from every source (s0-s3 shown), then sums in FP32.</text><rect width="1216" height="136" x="32" y="760" fill="#f3f6f8" stroke="#d2dde5" stroke-width="1.5" rx="12"/><text x="52" y="794" class="label">AFTER EITHER PATH</text><text x="325" y="794" class="stage blue">HSDP only: native FP32 AllReduce over replicas</text><text x="52" y="834" class="body muted">Replica-linked shard groups must agree on path and scaling before backward.</text><text x="52" y="868" class="body muted">Custom path: replica SUM; full-mesh scaling is applied in the RS hook.</text><rect width="592" height="140" x="32" y="920" fill="#fff" stroke="#d2dde5" stroke-width="1.5" rx="12"/><text x="52" y="954" class="label">WHEN THE CUSTOM PATH IS NOT USED</text><text x="52" y="989" class="small muted">Cross-node / unknown placement / singleton:</text><text x="52" y="1018" class="small muted">native communication and scaling remain.</text><text x="52" y="1047" class="small muted">Also native: off or param_dtype = reduce_dtype.</text><rect width="600" height="140" x="648" y="920" fill="#fff" stroke="#d2dde5" stroke-width="1.5" rx="12"/><text x="668" y="954" class="label">UNCHANGED BOUNDARIES</text><text x="668" y="989" class="small muted">Parameter AllGather and later gradient dtype casts.</text><text x="668" y="1018" class="small muted">FP32 addition order may differ from native RS:</text><text x="668" y="1047" class="small muted">bitwise identity is not guaranteed.</text><text x="34" y="1095" class="small muted">Mechanism only. Node-local placement does not guarantee acceleration.</text></svg>